name: Mac release

# Builds Vodsnip-<version>.dmg with tools/release.sh on a macOS 26 runner.
# Run it by hand (Actions tab, Run workflow) or push a tag like v0.1.0, which also drafts a GitHub release.
#
# With the Apple secrets below the DMG is signed with Developer ID, notarized and stapled.
# Without them it is signed ad hoc, which only runs on a Mac that built it (fine for checking the pipeline).
#
# Secrets: MACOS_CERT_P12 (base64 of the Developer ID Application .p12), MACOS_CERT_PASSWORD,
#          APPLE_ID, APPLE_APP_PASSWORD (app-specific password), APPLE_TEAM_ID.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Needed to attach the DMG to a release.
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      SIGN: ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          sw_vers -productVersion

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist.in)
          [[ "${GITHUB_REF_NAME#v}" == "$want" ]] || { echo "tag $GITHUB_REF_NAME does not match Info.plist.in version $want"; exit 1; }

      - name: Unit tests
        run: swift test

      - name: yt-dlp (official release, checksum verified)
        run: tools/fetch_vendor.sh

      # Building ffmpeg from source takes a while, so keep the result until the script or version changes.
      - name: ffmpeg cache
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: |
            vendor/bin/ffmpeg
            vendor/bin/ffprobe
          key: ffmpeg-lgpl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build_ffmpeg.sh') }}

      - name: ffmpeg (LGPL-only, built from source)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: tools/build_ffmpeg.sh

      - name: Tools are present and LGPL
        run: |
          vendor/bin/yt-dlp --version
          vendor/bin/ffmpeg -version | head -1
          vendor/bin/ffmpeg -version | grep -q -- '--enable-gpl' && { echo "ffmpeg is GPL"; exit 1; } || true

      - name: Import Developer ID certificate
        if: env.SIGN == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          kc="$RUNNER_TEMP/vodsnip.keychain-db"
          pw=$(uuidgen)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          security list-keychains -d user -s "$kc" login.keychain-db
          security default-keychain -s "$kc"
          security find-identity -v -p codesigning "$kc"
          # The notary login lives in the same temporary keychain.
          xcrun notarytool store-credentials vodsnip-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo "NOTARY_PROFILE=vodsnip-notary" >> "$GITHUB_ENV"

      - name: Build the DMG (signed and notarized when secrets exist)
        run: tools/release.sh

      - name: Check the DMG
        run: |
          dmg=$(ls dist/Vodsnip-*.dmg)
          ls -lh "$dmg"
          hdiutil verify "$dmg"
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -mountpoint "$mnt" -nobrowse -quiet
          ls "$mnt/Vodsnip.app/Contents/Resources/bin"
          codesign --verify --deep --strict "$mnt/Vodsnip.app"
          hdiutil detach "$mnt" -quiet
          if [[ "$SIGN" == "true" ]]; then
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          fi

      - name: Remove the temporary keychain
        if: always() && env.SIGN == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/vodsnip.keychain-db" || true

      - uses: actions/upload-artifact@v4
        with:
          name: Vodsnip-mac-dmg
          path: dist/Vodsnip-*.dmg
          if-no-files-found: error

      # A tag makes a draft release, so nothing goes public until you publish it by hand.
      # An unsigned DMG is never attached to a release.
      - name: Draft GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "Vodsnip ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/Vodsnip-*.dmg --clobber
